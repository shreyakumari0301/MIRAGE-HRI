# Phase 3: raw hand-raise labels plus timestamped events for a simulated robot.
# Temporal filtering and evaluation are not configured yet.

camera:
  index: 0
  width: 640
  height: 480
  # dshow avoids the Windows Media Foundation stall on many built-in webcams.
  backend: dshow
  max_consecutive_read_failures: 30

pose:
  model_path: models/pose_landmarker_lite.task
  num_poses: 1
  min_pose_detection_confidence: 0.5
  min_pose_presence_confidence: 0.5
  min_tracking_confidence: 0.5
  # Visibility is the model's own field, not a calibrated probability.
  # A frame is "detected" only when at least this many landmarks clear the gate.
  min_landmark_visibility: 0.5
  min_visible_landmarks: 8

hand_raise:
  # Normalized image distance. y grows downward, so this is how far the wrist
  # must sit above its shoulder. Visibility uses pose.min_landmark_visibility.
  raise_margin: 0.08

events:
  source: webcam/hand_raise_rule
  log_path: logs/session.jsonl

display:
  window_name: MIRAGE-HRI
